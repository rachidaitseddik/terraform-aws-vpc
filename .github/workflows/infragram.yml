# Generated by Infragr.am. Edit freely — it is never overwritten.
#
# Terraform runs entirely on this runner. Only a sanitized, independently
# scanned topology bundle leaves it; cloud credentials never do.
name: Infrastructure diagram

on:
  pull_request:
    paths:
      - "examples/simple/**/*.tf"
      - "examples/simple/**/*.tfvars"
      - "**/*.tf"
      - ".github/workflows/infragram.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: infragram-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423234116:role/infragram-dogfood-plan
          aws-region: eu-west-1
      - name: simple
        uses: Tekchbila-Studios/infragram-action@v1
        with:
          working-directory: "examples/simple"
          environment: "simple"
          secret-scan: "warn"
