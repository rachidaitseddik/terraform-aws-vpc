# Generated by Infragr.am. Running setup again regenerates this file,
# seeded from whatever it already says — so edit it here or there, not both.
#
# Terraform runs entirely on this runner. Only a sanitized, independently
# scanned topology bundle leaves it; cloud credentials never do.
name: Infrastructure diagram

on:
  pull_request:
    paths:
      - "examples/simple/**/*.tf"
      - "examples/simple/**/*.tfvars"
      - "examples/simple/**/.terraform.lock.hcl"
      - "examples/block-public-access/**/*.tf"
      - "examples/block-public-access/**/*.tfvars"
      - "examples/block-public-access/**/.terraform.lock.hcl"
      - "examples/flow-log/**/*.tf"
      - "examples/flow-log/**/*.tfvars"
      - "examples/flow-log/**/.terraform.lock.hcl"
      - "examples/complete/**/*.tf"
      - "examples/complete/**/*.tfvars"
      - "examples/complete/**/.terraform.lock.hcl"
      - ".github/workflows/infragram.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: infragram-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::637423234116:role/infragram-plan
          aws-region: us-east-1
      - name: simple
        uses: Tekchbila-Studios/infragram-action@v1
        with:
          working-directory: "examples/simple"
          environment: "simple"
          secret-scan: "warn"
      - name: block-public-access
        uses: Tekchbila-Studios/infragram-action@v1
        with:
          working-directory: "examples/block-public-access"
          environment: "block-public-access"
          secret-scan: "warn"
      - name: flow-log
        uses: Tekchbila-Studios/infragram-action@v1
        with:
          working-directory: "examples/flow-log"
          environment: "flow-log"
          secret-scan: "warn"
      - name: complete
        uses: Tekchbila-Studios/infragram-action@v1
        with:
          working-directory: "examples/complete"
          environment: "complete"
          secret-scan: "warn"
